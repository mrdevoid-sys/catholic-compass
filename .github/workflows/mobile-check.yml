name: Mobile checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Run Expo Doctor
        shell: bash
        run: |
          set +e
          output=$(EXPO_NO_TELEMETRY=1 npx expo-doctor 2>&1)
          code=$?
          if [ "$code" -ne 0 ]; then
            message=$(printf '%s' "$output" | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Expo Doctor::$message"
            exit "$code"
          fi
          printf '%s\n' "$output"
